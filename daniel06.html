    <button onclick="fetchPokemon()">Fetch</button>
    <div class="grafica">
        <canvas id="miCanvas"></canvas>
    </div>

    <script>
        const pokeImage = (url) => {
            const pokeImgTag = document.getElementById("pokeImg");
            pokeImgTag.src = url;
        };

        const fetchPokemon = () => {
            const pokeNameInput = document.getElementById("pokeName");
            let pokeName = pokeNameInput.value.trim().toLowerCase();
            if (!pokeName) return alert("Escribe un nombre de Pokémon.");

            const url = `https://pokeapi.co/api/v2/pokemon/${pokeName}`;
            fetch(url)
                .then((res) => {
                    if (res.status !== 200) {
                        alert("Pokémon no encontrado.");
                        throw new Error("Pokémon no encontrado");
                    }
                    return res.json();
                })
                .then((data) => {
                    if (data) {
                        let pokeImg = data.sprites.front_default;
                        pokeImage(pokeImg);

                        document.getElementById('pokename').innerHTML = `Nombre: ${data.name}`;
                        document.getElementById('pokeHe').innerHTML = `Altura: ${data.height}`;
                        document.getElementById('pokeWe').innerHTML = `Peso: ${data.weight}`;
                        document.getElementById('pokeitem').innerHTML = `Habilidad: ${data.abilities[0].ability.name}`;
                        document.getElementById('pokeType').innerHTML = `Tipo: ${data.types[0].type.name}`;
                        document.getElementById('pokemove1').innerHTML = `Movimiento 1: ${data.moves[0]?.move.name || 'N/A'}`;
                        document.getElementById('pokemove2').innerHTML = `Movimiento 2: ${data.moves[1]?.move.name || 'N/A'}`;
                        document.getElementById('pokemove3').innerHTML = `Movimiento 3: ${data.moves[2]?.move.name || 'N/A'}`;
                        document.getElementById('pokemove4').innerHTML = `Movimiento 4: ${data.moves[3]?.move.name || 'N/A'}`;

                        const ctx = document.getElementById("miCanvas").getContext("2d");
                        if (window.miChart) window.miChart.destroy();

                        window.miChart = new Chart(ctx, {
                            type: "bar",
                            data: {
                                labels: ["HP", "Attack", "Defense", "Special-A", "Special-D", "Speed"],
                                datasets: [{
                                    label: `${data.name}'s Stats`,
                                    data: data.stats.map(stat => stat.base_stat),
                                    backgroundColor: [
                                        'rgba(255, 99, 132, 0.5)',
                                        'rgba(54, 162, 235, 0.5)',
                                        'rgba(255, 206, 86, 0.5)',
                                        'rgba(75, 192, 192, 0.5)',
                                        'rgba(153, 102, 255, 0.5)',
                                        'rgba(255, 159, 64, 0.5)'
                                    ],
                                    borderColor: [
                                        'rgba(255, 99, 132, 1)',
                                        'rgba(54, 162, 235, 1)',
                                        'rgba(255, 206, 86, 1)',
                                        'rgba(75, 192, 192, 1)',
                                        'rgba(153, 102, 255, 1)',
                                        'rgba(255, 159, 64, 1)'
                                    ],
                                    borderWidth: 1
                                }]
                            },
                            options: {
                                scales: {
                                    x: {
                                        ticks: {
                                            color: 'purple',
                                            font: { size: 15 }
                                        }
                                    }
                                }
                            }
                        });
                    }
                })
                .catch(err => console.error(err));
        };
